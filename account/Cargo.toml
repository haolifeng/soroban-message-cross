[package]
name = "soroban-account-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "21.7.7" }

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
ed25519-dalek = { version = "1.0.1" }
# soroban-env-host accepts ">=2.0.0" but is not compatible with 3.x yet.
# Pin the compatible 2.x line so the test host builds with current crates.io.
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "=2.2.0" }
rand = { version = "0.7.3" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
